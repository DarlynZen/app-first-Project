<!-- Se hace este cambio para que product() se ejecute una vez, en lugar de 3 veces-->
@let prd = product();
@if (prd) {
  <div>
    <strong>{{ prd.name }}</strong>
    <span>Price: US$ {{ prd.price }}</span>
    <span>Stock: {{ prd.stock }}</span>
    <hr>
    <button (click)="addToCart(prd)">Add to Cart</button>
  </div>
}
