<div class="app-shell">

      <div class="brand__text">
        <h1>Mercado directo</h1>
        <p>Productos frescos, pagos seguros y un carrito claro.</p>
      </div>
    </div>
    <div class="header-meta">
      <span class="meta-pill">Envio rapido</span>
      <span class="meta-pill">Pago seguro</span>
