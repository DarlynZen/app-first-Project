@let list = productList();

<section class="product-list">
    <header class="product-list__header">
        <div>
            <h3>Catalogo de productos</h3>
            <p>Selecciona y agrega tus favoritos al carrito.</p>
        </div>
        <span class="product-list__count">{{ list.length }} items</span>
    </header>

    @if (list.length > 0) {
        <div class="product-grid">
            @for (product of list; track product.id) {
                <app-product [product]="product" (onAddToCart)="addToCart($event)"></app-product>
            }
        </div>
    } @else {
        <div class="product-empty">No hay productos disponibles por ahora.</div>
    }
</section>
