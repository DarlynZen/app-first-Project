<div class="container">
    <!-- () para salida, [] para entrada
    user-list esta usando el alias de users -->
    <app-user-list [users]="usersActive" (onDelete)="delete($event)" (onEdit)="edit($event)"></app-user-list>
    <app-user-form (onCreate)="usersActive = [...usersActive, $event]" [editUser]="userSelected"></app-user-form>
</div>
