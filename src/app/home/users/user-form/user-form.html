<form #userForm="ngForm">
  <div class="field">
    <label for="name">Nombre:</label>
    <!--() para salidas, [] para entradas. En lugar de event podria ser string o integer, event es mas general-->
    <input id="name" name="name" required [(ngModel)]="formData.name"/>
  </div>
  <div class="field">
    <label for="lastname">Apellido:</label>
    <input id="lastname" name="lastname" [(ngModel)]="formData.lastname"/>
  </div>
  <div class="field">
    <label for="email">Correo:</label>
    <input id="email" name="email" [(ngModel)]="formData.email" #email="ngModel" emailValidation/>
  </div>
  <div class="field">
    <label for="age">Edad:</label>
    <input id="age" name="age" [(ngModel)]="formData.age"/>
  </div>
  <div class="field">
    <label for="gender">Genero:</label>
    <select id="gender" name="gender" [(ngModel)]="formData.gender">
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
    </select>
  </div>

  <button type="button" (click)="onSubmit(userForm)">{{title}}</button>
  <button type="button" (click)="reset()">Limpiar</button>
</form>
