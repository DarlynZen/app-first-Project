<form #userForm="ngForm">
  <div class="field">
    <label for="name">Nombre:</label>
    <!--() para salidas, [] para entradas. En lugar de event podria ser string o integer, event es mas general-->
    <input id="name" name="name" [(ngModel)]="name"/>
  </div>
  <div class="field">
    <label for="lastName">Apellido:</label>
    <input id="lastName" name="lastName" [(ngModel)]="lastname"/>
  </div>
  <div class="field">
    <label for="email">Correo:</label>
    <input id="email" name="email" [(ngModel)]="email"/>
  </div>
  <div class="field">
    <label for="age">Edad:</label>
    <input id="age" name="age" [(ngModel)]="age"/>
  </div>
  <div class="field">
    <label for="gender">Genero:</label>
    <select id="gender" name="gender" [(ngModel)]="gender">
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
    </select>
  </div>

  <button type="button" (click)="onSubmit()">{{title}}</button>
  <button type="button" (click)="reset()">Limpiar</button>
</form>
