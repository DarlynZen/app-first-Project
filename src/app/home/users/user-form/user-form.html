<form>
  <div class="field">
    <label for="name">Nombre:</label>
    <!--() para salidas, [] para entradas. En lugar de event podria ser string o integer, event es mas general-->
    <input type="text" id="name" name="name" (input)="onInputName($event)" #nameInput/>
  </div>
  <div class="field">
    <label for="lastName">Apellido:</label>
    <input type="text" id="lastName" name="lastName" (input)="onInputLastname($event)" #lastNameInput/>
  </div>
  <div class="field">
    <label for="email">Correo:</label>
    <input type="email" id="email" name="email" (input)="onInputEmail($event)" #emailInput/>
  </div>
  <div class="field">
    <label for="age">Edad:</label>
    <input type="number" id="age" name="age" (input)="onInputAge($event)" #ageInput/>
  </div>
  <div class="field">
    <label for="gender">Genero:</label>
    <select id="gender" name="gender" (input)="onInputGender($event.target!)" #genderInput>
      <option value="masculino">Masculino</option>
      <option value="femenino">Femenino</option>
    </select>
  </div>

  <button type="button" (click)="onSubmit()">Guardar</button>
  
</form>
