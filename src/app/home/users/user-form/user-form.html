<form [formGroup]="fg">
  <div class="field">
    <label for="name">Nombre:</label>
    <!--() para salidas, [] para entradas. En lugar de event podria ser string o integer, event es mas general-->
    <!-- #name para referenciar el control y ngModel para vincularlo -->
    <input id="name" name="name" formControlName="name"/>
  </div>
  <div class="field">
    <label for="lastname">Apellido:</label>
    <input id="lastname" name="lastname" formControlName="lastname"/>
  </div>
  <div class="field">
    <label for="email">Correo:</label>
    <input id="email" name="email" formControlName="email"/>
    @if(fg.get('email')?.errors?.['required'] && fg.get('email')?.touched){
      <span class="error">El correo es requerido</span>
    }
  </div>
  <div class="field">
    <label for="age">Edad:</label>
    <input id="age" name="age" formControlName="age"/>
  </div>
  <div class="field">
    <label for="gender">Genero:</label>
    <select id="gender" name="gender" formControlName="gender">
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
    </select>
  </div>

  <button type="button" (click)="onSubmit()">{{title}}</button>
  <button type="button" (click)="reset()">Limpiar</button>
</form>
