<form [formGroup]="fg">
  <div class="field">
    <label for="name">Nombre:</label>
    <!--() para salidas, [] para entradas. En lugar de event podria ser string o integer, event es mas general-->
    <!-- #name para referenciar el control y ngModel para vincularlo -->
    <input id="name" name="name" formControlName="name" />
    <app-error-validations [fg]="fg" controlName="name" title="Nombre"></app-error-validations>
  </div>
  <div class="field">
    <label for="lastname">Apellido:</label>
    <input id="lastname" name="lastname" formControlName="lastname" />
    <app-error-validations
      [fg]="fg"
      controlName="lastname"
      title="Apellido"
    ></app-error-validations>
  </div>
  <div class="field">
    <label for="email">Correo:</label>
    <input id="email" name="email" formControlName="email" />
    <app-error-validations [fg]="fg" controlName="email" title="Correo"></app-error-validations>
  </div>
  <div class="field">
    <label for="age">Edad:</label>
    <input id="age" name="age" formControlName="age" />
    <app-error-validations [fg]="fg" controlName="age" title="Edad"></app-error-validations>
  </div>
  <div class="field">
    <label for="gender">Genero:</label>
    <select id="gender" name="gender" formControlName="gender">
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
    </select>
    <app-error-validations [fg]="fg" controlName="gender" title="Genero"></app-error-validations>
  </div>

  <button type="button" (click)="onSubmit()">{{ title }}</button>
  <button type="button" (click)="reset()">Limpiar</button>
  <app-error-validations [fg]="fg"></app-error-validations>
</form>
