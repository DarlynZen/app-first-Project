<form>
  <div class="field">
    <label for="name">Nombre:</label>
    <!--() para salidas, [] para entradas. En lugar de event podria ser string o integer, event es mas general-->
    <!-- #name para referenciar el control y ngModel para vincularlo -->
    <input id="name" type="text" type="text" [formField]="userForm.name" />
    <!-- @if (userForm.name().touched() && userForm.name().invalid()) {
      @let errors = userForm.name().errorSummary();
      @for (err of errors; track err.kind) {
        <div class="error">{{ err.message }}</div>
      }
    } -->
    <app-error-validations [fs]="userForm.name()"></app-error-validations>
  </div>
  <div class="field">
    <label for="lastname">Apellido:</label>
    <input id="lastname" type="text" [formField]="userForm.lastname" />
    <app-error-validations [fs]="userForm.lastname()"></app-error-validations>
  </div>
  <div class="field">
    <label for="email">Correo:</label>
    <input id="email" type="text" [formField]="userForm.email" />
    <app-error-validations [fs]="userForm.email()"></app-error-validations>
  </div>
  <div class="field">
    <label for="age">Edad:</label>
    <input id="age" type="number" [formField]="userForm.age" />
    <app-error-validations [fs]="userForm.age()"></app-error-validations>
  </div>
  <div class="field">
    <label for="gender">Genero:</label>
    <select id="gender" [formField]="userForm.gender">
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
    </select>
  </div>

  <button type="button" (click)="onSubmit()">{{ title }}</button>
  <button type="button" (click)="reset()">Limpiar</button>
  <app-error-validations [fs]="userForm()"></app-error-validations>
</form>
