@let items = productListCart();

<section class="cart">
    <header class="cart__header">
        <div>
            <h3>Tu carrito</h3>
            <p>Revisa cantidades antes de pagar.</p>
        </div>
        <span class="cart__count">{{ items.length }} items</span>
    </header>

    @if (items.length > 0) {
        <div class="cart__list">
            @for (item of items; track item.id) {
                <app-cart-item [item]="item" (onRemove)="removeItem($event)"></app-cart-item>
            }
        </div>

        <div class="cart__summary">
            <span class="cart__total-label">Total</span>
            <span class="cart__total-amount">US$ {{ total() }}</span>
        </div>
    } @else {
        <div class="cart__empty">Tu carrito esta vacio.</div>
    }
</section>
