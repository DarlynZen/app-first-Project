<mat-card class="login-card">
  <div class="login-card__badge">Secure access</div>

  <mat-card-header class="login-card__header">
    <mat-card-title>Sign in</mat-card-title>
    <mat-card-subtitle>Continue to the backoffice with a cleaner Material You experience.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form class="login-form">
      <mat-form-field class="login-field">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input matInput type="email" placeholder="name@company.com" autocomplete="email" [formField]="authForm.email" /> 
      </mat-form-field>
      <cdev-lib-error-validations [fs]="authForm.email()"></cdev-lib-error-validations>
      
      <mat-form-field class="login-field">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput type="password" placeholder="Enter your password" autocomplete="current-password" [formField]="authForm.password" />
      </mat-form-field>
      <cdev-lib-error-validations [fs]="authForm.password()"></cdev-lib-error-validations>

      <button mat-flat-button color="primary" type="button" (click)="save()" >Sign in</button>
    </form>
  </mat-card-content>
</mat-card>
